name: daily-astro-scrape

on:
  schedule:
    - cron: "17 18 * * *"        # 18:17 UTC = 01:17 WIB
  workflow_dispatch:             # tombol "Run workflow" untuk uji manual

permissions:
  contents: read

concurrency:
  group: astro-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependency
        run: pip install -r requirements.txt

      - name: Scrape, load ke BigQuery, arsip ke Drive
        env:
          ASTRO_DEVICE_ID: ${{ secrets.ASTRO_DEVICE_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          BQ_PROJECT: marketplace-tracker-513006
          BQ_DATASET: daily_astro
          BQ_TABLE: master_astro
          ASTRO_SWEEP: always             # UJI CEPAT dulu. Ganti ke "always" setelah uji berhasil
          ASTRO_TIME_BUDGET_MIN: "7200"
        run: python run_pipeline.py
